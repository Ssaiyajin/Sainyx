name: Deploy to Staging

on:
  push:
    branches:
      - Dev

jobs:
  pre-deployment:
    name: Pre-deployment validation
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: pre-deployment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to staging Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "deploy@sainyx.ai"
          git config user.name "Sainyx Deploy"
          git remote add staging "https://user:${HF_TOKEN}@huggingface.co/spaces/ssaiyajin/Sainyx-staging"
          git push staging HEAD:main --force

      - name: Set up Python for public API verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install public API check dependency
        run: python -m pip install requests

      - name: Verify the deployed staging API
        env:
          SAINYX_PUBLIC_API_URL: https://ssaiyajin-sainyx-staging.hf.space/api/v1
          SAINYX_API_KEY: ${{ secrets.SAINYX_STAGING_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/public_api_smoke.py
