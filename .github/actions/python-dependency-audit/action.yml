name: Python dependency audit
description: Audit pinned Python requirements for known vulnerabilities
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Audit pinned requirements
      shell: bash
      run: |
        python -m pip install --upgrade pip pip-audit
        python -m pip_audit -r requirements.txt -r requirements-torch.txt -r requirements-dev.txt
