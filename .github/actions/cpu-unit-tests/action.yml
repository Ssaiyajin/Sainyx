name: CPU unit tests
description: Install CPU dependencies and run the test suite
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
          requirements-torch.txt

    - name: Install CPU dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -r requirements.txt
        python -m pip install -r requirements-dev.txt

    - name: Run unit and API tests
      shell: bash
      env:
        SAINYX_VOICE_BACKEND: tone
      run: python -m pytest -q tests
